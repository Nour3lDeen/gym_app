name: gym_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.2+5

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: any
  equatable: any
  hive: any
  hive_flutter: any
  awesome_notifications: ^0.10.1
  intl: any
  uuid: any
  path_provider: any
  cupertino_icons: any
  image_picker: any
  flutter_image_compress: any
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: any
  build_runner: any
  
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/ 
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Black.ttf
        - asset: assets/fonts/Cairo-ExtraLight.ttf
        - asset: assets/fonts/Cairo-Light.ttf
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Medium.ttf
        - asset: assets/fonts/Cairo-Regular.ttf

fonts:
    - family: Cairo-Medium
      fonts:
        - asset: assets/fonts/Cairo-Medium.ttf